<path d="M257,312 L257,434" fill="none" stroke="#5b6470" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M743,392 L743,434" fill="none" stroke="#5b6470" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="24" y="530" width="952" height="90" rx="10" fill="#ffffff" stroke="#7d8aa0" stroke-width="1.5"/>
<text x="500.0" y="571.0" font-size="12.5" fill="#55627a" text-anchor="middle">Claude が、次にあなたの発言を受け取るときに、メモも一緒に受け取る</text>
<text x="500.0" y="588.0" font-size="12.5" fill="#55627a" text-anchor="middle">あとでやることなら TODO.md に書き足し、質問なら答える</text>
<path d="M500,492 L500,528" fill="none" stroke="#5b6470" stroke-width="1.8" marker-end="url(#a)"/>
