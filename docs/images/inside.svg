<text x="500" y="836" font-size="11.5" fill="#55627a" text-anchor="middle">ライブラリは 3 種類。Python の標準(最初から入っている)、追加で入れたもの、macOS の機能。ctypes は、Python から macOS の機能を呼ぶ、標準の部品。</text>
<text x="500" y="858" font-size="11.5" fill="#55627a" text-anchor="middle">Whisper は whisper.cpp、Kokoro は Kokoro-FastAPI という、Mac の中で動く別のプログラム。通信は、Mac の中(127.0.0.1)だけ。</text>
