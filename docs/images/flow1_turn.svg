<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="1000" height="690" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#1e2a3c" font-weight="700" text-anchor="start">声で 1 往復、会話するときの流れ(キーを押して話す方式)</text>
<rect x="24" y="54" width="190" height="596" rx="12" fill="#f7f9fc" stroke="#d5dce6" stroke-width="1"/>
<text x="119.0" y="76" font-size="13.5" fill="#33415a" font-weight="700" text-anchor="middle">あなた</text>
<rect x="230" y="54" width="300" height="596" rx="12" fill="#f7f9fc" stroke="#d5dce6" stroke-width="1"/>
<text x="380.0" y="76" font-size="13.5" fill="#33415a" font-weight="700" text-anchor="middle">会話のプログラム</text>
<rect x="546" y="54" width="190" height="596" rx="12" fill="#f7f9fc" stroke="#d5dce6" stroke-width="1"/>
<text x="641.0" y="76" font-size="13.5" fill="#33415a" font-weight="700" text-anchor="middle">Whisper / Kokoro</text>
<rect x="752" y="54" width="224" height="596" rx="12" fill="#f7f9fc" stroke="#d5dce6" stroke-width="1"/>
<text x="864.0" y="76" font-size="13.5" fill="#33415a" font-weight="700" text-anchor="middle">Claude Code</text>
<rect x="262" y="96" width="254" height="56" rx="10" fill="#e8f1ff" stroke="#1f6fd0" stroke-width="1.5"/>
<text x="389.0" y="128.5" font-size="12.5" fill="#2c4f86" text-anchor="middle">読み上げる文を受け取る</text>
<rect x="770" y="96" width="188" height="56" rx="10" fill="#ffffff" stroke="#7d8aa0" stroke-width="1.5"/>
<text x="864.0" y="128.5" font-size="12.5" fill="#55627a" text-anchor="middle">読み上げる文を渡す</text>
<path d="M770,124 L518,124" fill="none" stroke="#5b6470" stroke-width="1.8" marker-end="url(#a)"/>
<circle cx="262" cy="96" r="11" fill="#33415a"/>
<text x="262" y="100.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<rect x="262" y="178" width="254" height="56" rx="10" fill="#e8f1ff" stroke="#1f6fd0" stroke-width="1.5"/>
<text x="389.0" y="202.0" font-size="12.5" fill="#2c4f86" text-anchor="middle">英語や数字を、読み方に直す</text>
<text x="389.0" y="219.0" font-size="12.5" fill="#2c4f86" text-anchor="middle">(字幕には、もとの文のまま出す)</text>
<circle cx="262" cy="178" r="11" fill="#33415a"/>
<text x="262" y="182.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<rect x="262" y="260" width="254" height="56" rx="10" fill="#e8f1ff" stroke="#1f6fd0" stroke-width="1.5"/>
<text x="389.0" y="292.5" font-size="12.5" fill="#2c4f86" text-anchor="middle">声を再生する(マイクは閉じている)</text>
<rect x="564" y="260" width="154" height="56" rx="10" fill="#ffffff" stroke="#7d8aa0" stroke-width="1.5"/>
<text x="641.0" y="284.5" font-size="14" fill="#1e2a3c" font-weight="700" text-anchor="middle">Kokoro</text>
<text x="641.0" y="303.5" font-size="12.5" fill="#55627a" text-anchor="middle">読みを声にする</text>
<path d="M516,288 L562,288" fill="none" stroke="#5b6470" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/>
<rect x="42" y="260" width="154" height="56" rx="10" fill="#fff7e6" stroke="#e0b25a" stroke-width="1.5"/>
<text x="119.0" y="284.0" font-size="12.5" fill="#5c4a1e" text-anchor="middle">イヤホンで聞く</text>
<text x="119.0" y="301.0" font-size="12.5" fill="#5c4a1e" text-anchor="middle">字幕でも読める</text>
<path d="M262,288 L198,288" fill="none" stroke="#5b6470" stroke-width="1.8" marker-end="url(#a)"/>
<circle cx="262" cy="260" r="11" fill="#33415a"/>
<text x="262" y="264.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<rect x="42" y="342" width="154" height="56" rx="10" fill="#fff7e6" stroke="#e0b25a" stroke-width="1.5"/>
<text x="119.0" y="374.5" font-size="12.5" fill="#5c4a1e" text-anchor="middle">右 ⌘ を押す</text>
<rect x="262" y="342" width="254" height="56" rx="10" fill="#e8f1ff" stroke="#1f6fd0" stroke-width="1.5"/>
<text x="389.0" y="366.0" font-size="12.5" fill="#2c4f86" text-anchor="middle">マイクを開く</text>
<text x="389.0" y="383.0" font-size="12.5" fill="#2c4f86" text-anchor="middle">約 1 秒後に、合図の音</text>
<path d="M196,370 L260,370" fill="none" stroke="#5b6470" stroke-width="1.8" marker-end="url(#a)"/>
<circle cx="262" cy="342" r="11" fill="#33415a"/>
<text x="262" y="346.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<rect x="42" y="424" width="154" height="56" rx="10" fill="#fff7e6" stroke="#e0b25a" stroke-width="1.5"/>
<text x="119.0" y="448.0" font-size="12.5" fill="#5c4a1e" text-anchor="middle">合図のあとに話す</text>
<text x="119.0" y="465.0" font-size="12.5" fill="#5c4a1e" text-anchor="middle">考える間も、押したまま</text>
<rect x="262" y="424" width="254" height="56" rx="10" fill="#e8f1ff" stroke="#1f6fd0" stroke-width="1.5"/>
<text x="389.0" y="456.5" font-size="12.5" fill="#2c4f86" text-anchor="middle">息つぎごとに区切って送る</text>
<rect x="564" y="424" width="154" height="56" rx="10" fill="#ffffff" stroke="#7d8aa0" stroke-width="1.5"/>
<text x="641.0" y="448.5" font-size="14" fill="#1e2a3c" font-weight="700" text-anchor="middle">Whisper</text>
<text x="641.0" y="467.5" font-size="12.5" fill="#55627a" text-anchor="middle">声を文字にする</text>
<path d="M196,452 L260,452" fill="none" stroke="#5b6470" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M516,452 L562,452" fill="none" stroke="#5b6470" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/>
<circle cx="262" cy="424" r="11" fill="#33415a"/>
<text x="262" y="428.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<rect x="42" y="506" width="154" height="56" rx="10" fill="#fff7e6" stroke="#e0b25a" stroke-width="1.5"/>
<text x="119.0" y="538.5" font-size="12.5" fill="#5c4a1e" text-anchor="middle">キーを離す</text>
<rect x="262" y="506" width="254" height="56" rx="10" fill="#e8f1ff" stroke="#1f6fd0" stroke-width="1.5"/>
<text x="389.0" y="530.0" font-size="12.5" fill="#2c4f86" text-anchor="middle">マイクを閉じる</text>
<text x="389.0" y="547.0" font-size="12.5" fill="#2c4f86" text-anchor="middle">固有名詞などを、正しいつづりに直す</text>
<path d="M196,534 L260,534" fill="none" stroke="#5b6470" stroke-width="1.8" marker-end="url(#a)"/>
<circle cx="262" cy="506" r="11" fill="#33415a"/>
<text x="262" y="510.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
<rect x="262" y="588" width="254" height="56" rx="10" fill="#e8f1ff" stroke="#1f6fd0" stroke-width="1.5"/>
<text x="389.0" y="620.5" font-size="12.5" fill="#2c4f86" text-anchor="middle">発言(文字)を返す</text>
<rect x="770" y="588" width="188" height="56" rx="10" fill="#ffffff" stroke="#7d8aa0" stroke-width="1.5"/>
<text x="864.0" y="612.0" font-size="12.5" fill="#55627a" text-anchor="middle">発言を受け取り、</text>
<text x="864.0" y="629.0" font-size="12.5" fill="#55627a" text-anchor="middle">返事を考える・作業する</text>
<path d="M516,616 L768,616" fill="none" stroke="#5b6470" stroke-width="1.8" marker-end="url(#a)"/>
<circle cx="262" cy="588" r="11" fill="#33415a"/>
<text x="262" y="592.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">7</text>
<text x="500" y="674" font-size="12" fill="#55627a" text-anchor="middle">読み上げ(3)の途中で右 ⌘ を押すと、読み上げが止まり、4 に進む。押したのに何も話さなければ、続きを読む。</text>
</svg>
