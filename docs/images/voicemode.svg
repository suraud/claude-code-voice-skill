<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
<text x="24" y="34" font-size="17" fill="#1e2a3c" font-weight="700" text-anchor="start">Whisper と Kokoro を用意するソフト(VoiceMode)との関係</text>
<rect x="40" y="90" width="200" height="80" rx="10" fill="#e8f1ff" stroke="#1f6fd0" stroke-width="1.5"/>
<text x="140.0" y="126.5" font-size="14" fill="#0f3f85" font-weight="700" text-anchor="middle">voice.sh</text>
<text x="140.0" y="145.5" font-size="12.5" fill="#2c4f86" text-anchor="middle">入口のスクリプト</text>
<rect x="400" y="90" width="220" height="80" rx="10" fill="#f0f0f0" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="510.0" y="118.0" font-size="14" fill="#333333" font-weight="700" text-anchor="middle">VoiceMode</text>
<text x="510.0" y="137.0" font-size="12.5" fill="#555555" text-anchor="middle">音声会話用の、公開されているソフト</text>
<text x="510.0" y="154.0" font-size="12.5" fill="#555555" text-anchor="middle">(導入と起動の部分だけを借りる)</text>
<rect x="780" y="70" width="180" height="56" rx="10" fill="#ffffff" stroke="#7d8aa0" stroke-width="1.5"/>
<text x="870.0" y="94.5" font-size="14" fill="#1e2a3c" font-weight="700" text-anchor="middle">Whisper</text>
<text x="870.0" y="113.5" font-size="12.5" fill="#55627a" text-anchor="middle">音声をテキストに変換する</text>
<rect x="780" y="136" width="180" height="56" rx="10" fill="#ffffff" stroke="#7d8aa0" stroke-width="1.5"/>
<text x="870.0" y="160.5" font-size="14" fill="#1e2a3c" font-weight="700" text-anchor="middle">Kokoro</text>
<text x="870.0" y="179.5" font-size="12.5" fill="#55627a" text-anchor="middle">テキストを音声に変換する</text>
<rect x="770" y="330" width="200" height="80" rx="10" fill="#e8f1ff" stroke="#1f6fd0" stroke-width="1.5"/>
<text x="870.0" y="366.5" font-size="14" fill="#0f3f85" font-weight="700" text-anchor="middle">listen.py</text>
<text x="870.0" y="385.5" font-size="12.5" fill="#2c4f86" text-anchor="middle">会話のプログラム</text>
<path d="M240,130 L398,130" fill="none" stroke="#5b6470" stroke-width="1.8" marker-end="url(#a)"/>
<text x="319.0" y="118" font-size="11.5" fill="#5b6470" text-anchor="middle">「起動して」「止めて」と頼む</text>
<text x="319" y="150" font-size="11" fill="#5b6470" text-anchor="middle">(コマンドを実行する)</text>
<path d="M620,118 L778,100" fill="none" stroke="#5b6470" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M620,142 L778,162" fill="none" stroke="#5b6470" stroke-width="1.8" marker-end="url(#a)"/>
<text x="700" y="66" font-size="11.5" fill="#5b6470" text-anchor="middle">インストールする(最初の 1 回だけ)</text>
<text x="700" y="84" font-size="11.5" fill="#5b6470" text-anchor="middle">起動する・止める(使うたび)</text>
<path d="M510,170 L510,370 L768,370" fill="none" stroke="#9a9a9a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="498" y="290" font-size="11.5" fill="#555555" text-anchor="end">Python と、追加のライブラリ 3 つを貸している</text>
<text x="498" y="308" font-size="11" fill="#555555" text-anchor="end">(listen.py は、VoiceMode の Python で動く)</text>
<path d="M870,330 L870,194" fill="none" stroke="#1f6fd0" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="858" y="256" font-size="12" fill="#1f6fd0" font-weight="700" text-anchor="end">HTTP で、直接やり取りする</text>
<text x="858" y="274" font-size="11.5" fill="#1f6fd0" text-anchor="end">(VoiceMode は、通らない)</text>
<text x="500" y="440" font-size="12" fill="#55627a" text-anchor="middle">会話の最中に、listen.py と VoiceMode がやり取りすることはない。VoiceMode の役は、準備(インストール、起動、停止)と、道具を貸すことだけ。</text>
</svg>
